<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قدّم مقالة - مدونة الغموض</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/submit.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="logo">مدونة الغموض</h1>
      <nav class="nav">
        <ul>
          <li><a href="index.html">الرئيسية</a></li>
          <li><a href="index.html#categories">الأقسام</a></li>
          <li><a href="index.html#popular">أشهر المقالات</a></li>
          <li><a href="submit_article.html">قدّم مقالة</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="submit-section">
      <h2>أرسل مقالتك الغامضة</h2>
      <p>نحن نبحث دائمًا عن كتاب مميزين يشاركوننا شغف الغموض. استخدم النموذج أدناه لإرسال مقالك.</p>
      <form class="submit-form">
        <label for="name">الاسم:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">البريد الإلكتروني:</label>
        <input type="email" id="email" name="email" required>

        <label for="title">عنوان المقالة:</label>
        <input type="text" id="title" name="title" required>

        <label for="content">المحتوى:</label>
        <textarea id="content" name="content" rows="10" required></textarea>

        <button type="submit">إرسال</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 مدونة الغموض - جميع الحقوق محفوظة</p>
    </div>
  </footer>
</body>
</html>
